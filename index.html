<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページ一覧</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- ヘッダー -->
        <div class="bg-indigo-600 px-6 py-5 text-white">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                HTMLファイル一覧
            </h1>
            <p class="text-indigo-200 text-sm mt-1">同じフォルダ内にあるページ</p>
        </div>

        <!-- コンテンツエリア -->
        <div class="p-6">
            <!-- ローディング表示 -->
            <div id="loading" class="flex flex-col items-center justify-center py-8">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mb-3"></div>
                <p class="text-slate-500 text-sm">ファイル一覧を読み込んでいます...</p>
            </div>

            <!-- エラー表示 -->
            <div id="error-message" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm mb-4"></div>

            <!-- ファイルリスト -->
            <ul id="html-list" class="space-y-2.5 hidden">
                <!-- JavaScriptでここに動的に追加されます -->
            </ul>
        </div>
        
        <!-- フッター -->
        <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex justify-between items-center">
            <span class="text-xs text-slate-400">GitHub Pages API</span>
            <span id="file-count" class="text-xs font-medium text-slate-500"></span>
        </div>
    </div>

    <!-- スクリプト -->
    <script>
        async function loadHtmlFiles() {
            const hostname = window.location.hostname; // 例: username.github.io
            const pathname = window.location.pathname;   // 例: /repo-name/index.html

            const username = hostname.split('.')[0];
            const pathSegments = pathname.split('/').filter(Boolean);
            const repoName = pathSegments[0] || '';
            const subPath = pathSegments.slice(1, -1).join('/');

            const apiUrl = `https://api.github.com/repos/${username}/${repoName}/contents/${subPath}`;

            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error-message');
            const listEl = document.getElementById('html-list');
            const countEl = document.getElementById('file-count');

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('ファイル一覧の取得に失敗しました。リポジトリの公開設定やURLを確認してください。');
                }

                const files = await response.json();
                loadingEl.classList.add('hidden');
                
                // 現在開いているファイル名（自分自身を除外するため）
                const currentFileName = pathname.split('/').pop() || 'index.html';
                let htmlFilesCount = 0;

                files.forEach(file => {
                    // .htmlファイルかつ自分自身以外を対象にする
                    if (file.type === 'file' && file.name.endsWith('.html') && file.name !== currentFileName) {
                        htmlFilesCount++;
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <a href="${file.name}" class="flex items-center justify-between p-3.5 rounded-xl border border-slate-100 hover:border-indigo-200 hover:bg-indigo-50/50 transition-all group shadow-sm">
                                <span class="font-medium text-slate-700 group-hover:text-indigo-600 flex items-center gap-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 group-hover:text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                    ${file.name}
                                </span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300 group-hover:text-indigo-500 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                </svg>
                            </a>
                        `;
                        listEl.appendChild(li);
                    }
                });

                if (htmlFilesCount === 0) {
                    listEl.innerHTML = `<li class="text-center py-8 text-slate-400 text-sm">ほかのHTMLファイルは見つかりませんでした。</li>`;
                }

                listEl.classList.remove('hidden');
                countEl.textContent = `${htmlFilesCount} 件のファイル`;

            } catch (error) {
                loadingEl.classList.add('hidden');
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
                countEl.textContent = 'エラー';
            }
        }

        // 実行
        loadHtmlFiles();
    </script>
</body>
</html>
