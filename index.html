<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全HTMLファイル一覧</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- ヘッダー -->
        <div class="bg-indigo-600 px-6 py-5 text-white">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                </svg>
                リポジトリ内 全HTML一覧
            </h1>
            <p class="text-indigo-200 text-sm mt-1">どのフォルダにあるページも自動で検出します</p>
        </div>

        <!-- コンテンツエリア -->
        <div class="p-6">
            <!-- ローディング表示 -->
            <div id="loading" class="flex flex-col items-center justify-center py-8">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mb-3"></div>
                <p class="text-slate-500 text-sm">リポジトリ全体からファイルをスキャン中...</p>
            </div>

            <!-- エラー表示 -->
            <div id="error-message" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm mb-4"></div>

            <!-- ファイルリスト -->
            <ul id="html-list" class="space-y-2.5 hidden max-h-[60vh] overflow-y-auto pr-1">
                <!-- JavaScriptでここに動的に追加されます -->
            </ul>
        </div>
        
        <!-- フッター -->
        <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex justify-between items-center">
            <span class="text-xs text-slate-400">GitHub Git Trees API</span>
            <span id="file-count" class="text-xs font-medium text-slate-500"></span>
        </div>
    </div>

    <!-- スクリプト -->
    <script>
        async function loadAllHtmlFiles() {
            const hostname = window.location.hostname; // 例: username.github.io
            const pathname = window.location.pathname;   // 例: /repo-name/sub/index.html

            const username = hostname.split('.')[0];
            const pathSegments = pathname.split('/').filter(Boolean);
            const repoName = pathSegments[0] || '';

            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error-message');
            const listEl = document.getElementById('html-list');
            const countEl = document.getElementById('file-count');

            try {
                // 1. リポジトリの基本情報を取得してデフォルトブランチ（mainやmaster）を特定する
                const repoInfoRes = await fetch(`https://api.github.com/repos/${username}/${repoName}`);
                if (!repoInfoRes.ok) {
                    throw new Error('リポジトリ情報の取得に失敗しました。公開設定を確認してください。');
                }
                const repoInfo = await repoInfoRes.json();
                const defaultBranch = repoInfo.default_branch || 'main';

                // 2. Git Trees APIを使ってリポジトリ全体のファイルツリーを再帰的に取得
                const treeUrl = `https://api.github.com/repos/${username}/${repoName}/git/trees/${defaultBranch}?recursive=1`;
                const treeRes = await fetch(treeUrl);
                if (!treeRes.ok) {
                    throw new Error('ファイルツリーの取得に失敗しました。');
                }

                const treeData = await treeRes.json();
                loadingEl.classList.add('hidden');

                // 現在開いているファイルのパス（リポジトリルートからの相対パス）を計算
                const currentRepoPath = pathname.replace(new RegExp(`^/${repoName}/`), '').replace(/^\/+/, '');

                let htmlFilesCount = 0;

                // treeData.tree にはリポジトリ内の全ファイル・フォルダがフラットな配列で格納されている
                treeData.tree.forEach(item => {
                    // 種類がファイル(blob)であり、拡張子が .html で、自分自身ではないもの
                    if (item.type === 'blob' && item.path.endsWith('.html') && item.path !== currentRepoPath) {
                        htmlFilesCount++;

                        const li = document.createElement('li');
                        // リンク先はリポジトリのルートからの絶対パス (/リポジトリ名/ファイルパス) にすることで、どの階層からでも確実にアクセス可能にする
                        const fileUrl = `/${repoName}/${item.path}`;

                        // パスとファイル名を分離して見やすく表示する
                        const lastSlashIndex = item.path.lastIndexOf('/');
                        const dirPath = lastSlashIndex !== -1 ? item.path.substring(0, lastSlashIndex + 1) : '';
                        const fileName = lastSlashIndex !== -1 ? item.path.substring(lastSlashIndex + 1) : item.path;

                        li.innerHTML = `
                            <a href="${fileUrl}" class="flex items-center justify-between p-3.5 rounded-xl border border-slate-100 hover:border-indigo-200 hover:bg-indigo-50/50 transition-all group shadow-sm">
                                <div class="flex items-center gap-3 overflow-hidden">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                    <div class="truncate">
                                        <p class="font-medium text-slate-800 group-hover:text-indigo-600 truncate text-sm">${fileName}</p>
                                        ${dirPath ? `<p class="text-xs text-slate-400 truncate">${dirPath}</p>` : ''}
                                    </div>
                                </div>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-300 group-hover:text-indigo-500 transform group-hover:translate-x-1 transition-transform shrink-0 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                </svg>
                            </a>
                        `;
                        listEl.appendChild(li);
                    }
                });

                if (htmlFilesCount === 0) {
                    listEl.innerHTML = `<li class="text-center py-8 text-slate-400 text-sm">ほかのHTMLファイルは見つかりませんでした。</li>`;
                }

                listEl.classList.remove('hidden');
                countEl.textContent = `${htmlFilesCount} 件のファイル`;

            } catch (error) {
                loadingEl.classList.add('hidden');
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
                countEl.textContent = 'エラー';
            }
        }

        // 実行
        loadAllHtmlFiles();
    </script>
</body>
</html>
