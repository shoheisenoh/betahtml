<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub HTML Finder</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#191f28;--panel2:#202936;--line:#303b49;--text:#edf2f7;--muted:#9ba9b8;--accent:#77b7ff;--good:#79d6a5;--danger:#ff8d8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}
h1{font-size:22px;margin:0 0 4px}.sub,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(280px,390px) 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.pad{padding:16px}
label{display:block;font-weight:650;margin:0 0 7px}input{width:100%;background:#0e1319;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit;outline:none}
input:focus{border-color:var(--accent)}.field{margin-bottom:13px}.row{display:flex;gap:8px}.row>*{min-width:0}.row input{flex:1}
button,.button{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:var(--panel2);color:var(--text);font:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary{background:#245b91;border-color:#367bb8}button:disabled{opacity:.45;cursor:wait}
.note{font-size:12px;color:var(--muted);margin-top:8px}.status{padding:10px 12px;border-radius:9px;background:#111821;color:var(--muted);margin-top:12px;min-height:40px}
.status.error{color:var(--danger)}.status.ok{color:var(--good)}
.toolbar{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar input{max-width:260px;padding:8px 10px}.count{margin-left:auto;color:var(--muted);font-size:12px}
.files{max-height:calc(100vh - 300px);overflow:auto}.file{padding:11px 14px;border-bottom:1px solid #29323d;cursor:pointer;display:flex;align-items:center;gap:10px}
.file:hover,.file.active{background:#253446}.file .path{overflow-wrap:anywhere;flex:1}.file small{color:var(--muted)}
.preview-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.preview-head strong{flex:1;min-width:180px;overflow-wrap:anywhere}iframe{display:block;width:100%;height:calc(100vh - 220px);min-height:420px;background:white;border:0}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);height:420px;padding:24px}
@media(max-width:850px){.app{padding:14px}.layout{grid-template-columns:1fr}.files{max-height:340px}iframe{height:65vh;min-height:380px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1>GitHub HTML Finder</h1><div class="sub">GitHub リポジトリ内の HTML を検索し、その場でプレビュー・起動</div></div>
    <span class="muted">単体HTML / API接続</span>
  </header>
  <div class="layout">
    <section class="panel">
      <div class="pad">
        <div class="field"><label for="repo">GitHub リポジトリ</label><input id="repo" placeholder="https://github.com/owner/repository または owner/repository"></div>
        <div class="row">
          <div class="field" style="flex:1"><label for="branch">ブランチ（任意）</label><input id="branch" placeholder="既定ブランチを自動取得"></div>
          <button class="primary" id="scan" style="align-self:flex-end">HTMLを検索</button>
        </div>
        <div class="field"><label for="token">GitHub トークン（任意）</label><input id="token" type="password" autocomplete="off" placeholder="公開リポジトリなら通常不要"></div>
        <div class="note">公開リポジトリはトークンなしで利用できます。非公開リポジトリには、対象リポジトリの Contents 読み取り権限を持つトークンが必要です。トークンはこのページ内でのみ使用し、保存・送信先への転送はしません。</div>
        <div id="status" class="status">リポジトリを入力して「HTMLを検索」を押してください。</div>
      </div>
      <div class="toolbar"><strong>見つかったHTML</strong><span id="count" class="count">0件</span></div>
      <div id="files" class="files"><div class="empty">検索結果はここに表示されます。</div></div>
    </section>
    <section class="panel">
      <div class="preview-head">
        <strong id="selected">プレビュー対象が未選択です</strong>
        <a id="open" class="button" href="#" target="_blank" rel="noopener" style="pointer-events:none;opacity:.45">別タブで開く</a>
        <button id="raw" disabled>Rawを開く</button>
      </div>
      <div id="preview" class="empty">左側の一覧からHTMLファイルを選択してください。</div>
    </section>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { files: [], selected: null, headers: {} };
  const status = (message, type='') => { $('status').textContent = message; $('status').className = 'status ' + type; };
  function parseRepo(value) {
    const s = value.trim().replace(/\/+$/, '');
    const m = s.match(/(?:https?:\/\/)?(?:www\.)?github\.com\/([^/]+)\/([^/#?]+)/i);
    const parts = m ? [m[1], m[2]] : s.split('/');
    if (parts.length < 2 || !parts[0] || !parts[1]) throw new Error('owner/repository の形式で入力してください。');
    return { owner: parts[0], repo: parts[1].replace(/\.git$/i, '') };
  }
  async function api(url) {
    const res = await fetch(url, {headers: state.headers});
    if (!res.ok) {
      let detail = '';
      try { const j = await res.json(); detail = j.message || ''; } catch {}
      throw new Error(`GitHub API エラー (${res.status})${detail ? ': ' + detail : ''}`);
    }
    return res.json();
  }
  function renderFiles() {
    $('count').textContent = `${state.files.length}件`;
    const host = $('files'); host.replaceChildren();
    if (!state.files.length) { host.innerHTML = '<div class="empty">HTMLファイルが見つかりませんでした。</div>'; return; }
    for (const file of state.files) {
      const el = document.createElement('div');
      el.className = 'file' + (state.selected?.path === file.path ? ' active' : '');
      const name = document.createElement('span'); name.textContent = 'HTML';
      const path = document.createElement('span'); path.className = 'path'; path.textContent = file.path;
      const size = document.createElement('small'); size.textContent = file.size ? `${Math.ceil(file.size/1024)} KB` : '';
      el.append(name, path, size); el.addEventListener('click', () => selectFile(file)); host.append(el);
    }
  }
  async function selectFile(file) {
    state.selected = file; renderFiles();
    $('selected').textContent = file.path;
    $('preview').className = ''; $('preview').replaceChildren();
    $('preview').textContent = 'HTMLを読み込んでいます…';
    const rawUrl = `https://raw.githubusercontent.com/${file.owner}/${file.repo}/${encodeURIComponent(file.branch).replace(/%2F/g,'/')}/${file.path.split('/').map(encodeURIComponent).join('/')}`;
    $('open').href = rawUrl; $('open').style.pointerEvents = 'auto'; $('open').style.opacity = '1';
    $('raw').disabled = false; $('raw').onclick = () => window.open(rawUrl, '_blank', 'noopener');
    try {
      const res = await fetch(rawUrl, {headers: state.headers});
      if (!res.ok) throw new Error(`HTML取得に失敗しました (${res.status})`);
      const source = await res.text();
      const frame = document.createElement('iframe');
      frame.title = file.path;
      frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox');
      frame.srcdoc = source;
      $('preview').replaceChildren(frame);
    } catch (e) {
      $('preview').className = 'empty'; $('preview').textContent = e.message;
    }
  }
  async function scan() {
    $('scan').disabled = true; state.files = []; state.selected = null; renderFiles();
    $('preview').className = 'empty'; $('preview').textContent = '検索結果からHTMLを選択してください。';
    $('open').href = '#'; $('open').style.pointerEvents = 'none'; $('open').style.opacity = '.45'; $('raw').disabled = true;
    try {
      const {owner, repo} = parseRepo($('repo').value);
      const token = $('token').value.trim();
      state.headers = token ? {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'} : {Accept:'application/vnd.github+json'};
      status('リポジトリ情報を取得しています…');
      const info = await api(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`);
      const branch = $('branch').value.trim() || info.default_branch;
      status(`ブランチ「${branch}」のファイル一覧を取得しています…`);
      const tree = await api(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
      if (tree.truncated) status('注意: GitHub側でツリー結果が省略されています。大規模リポジトリでは全件取得できない場合があります。');
      state.files = (tree.tree || []).filter(x => x.type === 'blob' && /\.html?$/i.test(x.path))
        .map(x => ({path:x.path, size:x.size || 0, owner, repo, branch}))
        .sort((a,b) => a.path.localeCompare(b.path));
      renderFiles();
      status(`${owner}/${repo} の ${branch} からHTMLを ${state.files.length}件検出しました。`, 'ok');
    } catch(e) { status(e.message, 'error'); }
    finally { $('scan').disabled = false; }
  }
  $('scan').addEventListener('click', scan);
  $('repo').addEventListener('keydown', e => { if(e.key === 'Enter') scan(); });
})();
</script>
</body>
</html>
